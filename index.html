<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <title>Pottgarten Game</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pottgarten">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Pottgarten%20Game%22,%22short_name%22:%22Pottgarten%22,%22start_url%22:%22index.html%22,%22display%22:%22fullscreen%22,%22orientation%22:%22landscape%22,%22background_color%22:%22%23222222%22}">

    <style>
        /* Blockiert Textmarkierung, erlaubt aber normales Klicken auf Overlays */
        *, *::before, *::after {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
            box-sizing: border-box;
        }

        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #111; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-family: sans-serif; 
            color: white; 
        }
        
        /* Die perfekte mathematische Skalierung für Handys im Querformat */
        #gameContainer { 
            position: relative; 
            width: 100vw;
            height: 56.25vw; /* 16:9 Verhältnis basierend auf der Breite */
            max-width: 177.78vh; /* Verhindert das Rauswachsen bei sehr breiten Handys */
            max-height: 100vh; /* Verhindert das Rauswachsen nach unten */
            aspect-ratio: 1066 / 600;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9); 
            background: #000;
        }
        
        canvas { 
            width: 100%; 
            height: 100%; 
            display: block; 
            background: #87CEEB; 
        }
        
        #uiOverlay { position: absolute; top: 20px; left: 20px; font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); z-index: 10; display: flex; gap: 20px; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; font-size: 32px; font-weight: bold; display: none; }
        .screen button { margin-top: 20px; padding: 12px 24px; font-size: 18px; cursor: pointer; border: none; background: #28a745; color: white; border-radius: 5px; font-weight: bold; }
        
        /* Titelbildschirm füllt den Raum exakt aus */
        #startScreen { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: #333; 
            z-index: 30; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer; 
            background-size: cover; 
            background-position: center; 
        }
        
        #startText { 
            position: absolute; 
            bottom: 12%; 
            font-size: 20px; 
            background: rgba(0,0,0,0.85); 
            padding: 14px 28px; 
            border-radius: 8px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            text-align: center; 
            line-height: 1.4; 
            border: 2px solid #ffc107; 
            width: 85%;
            max-width: 520px;
            pointer-events: none; /* Klicks gehen durch den Text direkt auf das StartScreen-Element */
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <!-- Der Klick-Trigger liegt auf der gesamten Box -->
    <div id="startScreen" onclick="startGame()">
        <div id="startText">
            Tippe hier zum Starten<br>
            <span style="font-size: 13px; color: #ffc107; text-transform: none; font-weight: normal; letter-spacing: 0; display: block; margin-top: 4px;">
                Tipp: Für echtes Vollbild füge diese Seite<br>über das Browser-Menü zum Home-Bildschirm hinzu!
            </span>
        </div>
    </div>

    <div id="uiOverlay">
        <div id="livesBoard">Leben: ❤️❤️❤️</div>
    </div>
    
    <div id="gameOverScreen" class="screen">
        <span style="color: #ff4d4d;">GAME OVER</span>
        <button onclick="resetGame()">Nochmal versuchen</button>
    </div>

    <div id="winScreen" class="screen" style="padding: 20px; text-align: center;">
        <span style="color: #4dff4d; font-size: 38px; margin-bottom: 5px;">GEWONNEN!</span>
        <div style="font-size: 18px; max-width: 600px; line-height: 1.4; color: #eee;" id="finalScore">
            Super du hast es geschafft. Sende Baua nun via privater Telegram Nachricht den Code <br>
            <strong style="color: #ffc107; font-size: 22px; display: block; margin-top: 8px;">"Keine Macht den Hodenkobolden"</strong>
        </div>
        <button onclick="resetGame()">Nochmal spielen</button>
    </div>

    <canvas id="gameCanvas" width="1066" height="600"></canvas>
</div>

<script src="level.js"></script>
<script src="player.js"></script>
<script src="game.js"></script>

</body>
</html>
