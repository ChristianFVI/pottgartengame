<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein KI Autoscroller</title>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; color: white; overflow: hidden; }
        #gameContainer { position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        canvas { display: block; background: #87CEEB; }
        #uiOverlay { position: absolute; top: 20px; left: 20px; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); z-index: 10; display: flex; gap: 30px; }
        .screen { position: absolute; top: 0; left: 0; width: 800px; height: 600px; background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; font-size: 40px; font-weight: bold; display: none; }
        .screen button { margin-top: 25px; padding: 12px 24px; font-size: 20px; cursor: pointer; border: none; background: #28a745; color: white; border-radius: 5px; }
        #winScreen { text-align: center; padding: 40px; box-sizing: border-box; }
        
        /* Titelbildschirm mit nach unten versetztem Text */
        #startScreen { position: absolute; top: 0; left: 0; width: 800px; height: 600px; background: #333; z-index: 30; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; background-size: cover; background-position: center; }
        #startText { position: absolute; bottom: 80px; font-size: 28px; background: rgba(0,0,0,0.7); padding: 15px 30px; border-radius: 10px; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; }
    </style>
</head>
<body>

<div id="gameContainer">
    <!-- Titelbildschirm -->
    <div id="startScreen" onclick="startGame()">
        <div id="startText">Klicke zum Starten</div>
    </div>

    <div id="uiOverlay">
        <div id="livesBoard">Leben: ❤️❤️❤️</div>
    </div>
    
    <div id="gameOverScreen" class="screen">
        <span style="color: #ff4d4d;">GAME OVER</span>
        <button onclick="resetGame()">Nochmal versuchen</button>
    </div>

    <div id="winScreen" class="screen">
        <span style="color: #4dff4d; font-size: 44px; margin-bottom: 10px;">GEWONNEN!</span>
        <div style="font-size: 22px; max-width: 650px; line-height: 1.5; color: #eee;" id="finalScore">
            Super du hast es geschafft. Sende Baua nun via privater Telegram Nachricht den Code <br>
            <strong style="color: #ffc107; font-size: 26px; display: block; margin-top: 10px;">"Keine Macht den Hodenkobolden"</strong>
        </div>
        <button onclick="resetGame()">Nochmal spielen</button>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<script src="level.js"></script>
<script src="player.js"></script>
<script src="game.js"></script>

</body>
</html>
